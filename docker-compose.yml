services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: measurements
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      ALEMBIC_URL: postgresql://postgres:postgres@db:5432/measurements
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/measurements
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      REDIS_URL: redis://redis:6379/0
      VERIFICATION_CODE_EXPIRE: 300
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    
volumes:
  postgres_data: